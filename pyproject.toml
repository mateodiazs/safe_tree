[project]
name = "safe-tree"
version = "0.1.0"
description = "A purely functional, immutable tree for Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pdoc>=16.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # conflicts with D211 (no blank line before docstring)
    "D212",   # conflicts with D213 (multi-line docstring summary start)
    "COM812", # conflicts with ruff format's trailing comma handling
    "ISC001", # conflicts with ruff format's implicit string concat handling
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # assert is the point of a test
    "D",       # tests don't need docstrings
    "ANN201",  # test functions don't need return annotations
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
