<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>safe_tree playground</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="page">
    <header>
      <h1>safe_tree playground</h1>
      <p class="subtitle">
        Every insert/delete adds a new version below. Old versions never change.
      </p>
    </header>

    <div class="panel">
      <div class="controls">
        <input id="value-input" type="number" inputmode="numeric" placeholder="value" />
        <button id="insert-btn" class="primary">Insert</button>
        <button id="delete-btn" class="secondary">Delete</button>
        <button id="random-btn">Random</button>
        <button id="reset-btn">Reset</button>
      </div>
    </div>

    <div class="panel">
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="panel">
      <div class="legend">
        <span><span class="swatch new"></span>new / copied node</span>
        <span><span class="swatch shared"></span>shared with previous version</span>
      </div>
      <div id="tree-wrap">
        <svg id="tree-svg" viewBox="0 0 100 100"></svg>
      </div>
    </div>

    <div class="panel">
      <div class="stats">
        <div>
          <div class="stat-value" id="stat-size">0</div>
          <div class="stat-label">size</div>
        </div>
        <div>
          <div class="stat-value" id="stat-depth">0</div>
          <div class="stat-label">depth</div>
        </div>
        <div>
          <div class="stat-value" id="stat-version">v0</div>
          <div class="stat-label">version</div>
        </div>
      </div>
      <div class="values" id="values"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
